name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-bench:
    name: Run Tests & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests -v

      - name: Run Performance Benchmark
        run: |
          python3 bench.py
